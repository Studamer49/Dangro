services:
  - type: web
    name: dangro
    runtime: node
    plan: free
    buildCommand: |
      npm install --prefix server
      npm install --prefix client
      npm run build --prefix client
      npm --prefix server run db:generate
      npm run build --prefix server
    # No preDeployCommand: Prisma migrations need DATABASE_URL, and this
    # service is backed by MongoDB, whose schema needs no migration step.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_URL
        value: https://dangro.onrender.com
      - key: DATABASE_PROVIDER
        value: mongo
      - key: MONGODB_DB_NAME
        value: dangro
      # Media lives on a separate host (see MEDIA.md); the API 302-redirects
      # browsers there so video never passes through Render.
      - key: MEDIA_PROVIDER
        value: remote
      # Set these in the Render Dashboard (Environment tab), never in the repo:
      #   MONGODB_URI      the mongodb+srv:// string from Atlas
      #   MEDIA_PUBLIC_URL public base URL of the media host
      #   MEDIA_INGEST_URL where the API pushes uploads (defaults to the above)
      #   MEDIA_INGEST_KEY must match MEDIA_KEY on the media host
      - key: MONGODB_URI
        sync: false
      - key: MEDIA_PUBLIC_URL
        sync: false
      - key: MEDIA_INGEST_URL
        sync: false
      - key: MEDIA_INGEST_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true