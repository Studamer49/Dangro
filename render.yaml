services:
  - type: web
    name: dangro
    runtime: node
    plan: free
    buildCommand: |
      npm install --prefix server
      npm install --prefix client
      npm run build --prefix client
      npm --prefix server run db:generate
      npm run build --prefix server
    # No preDeployCommand: Prisma migrations need DATABASE_URL, and this
    # service is backed by MongoDB, whose schema needs no migration step.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CLIENT_URL
        value: https://dangro.onrender.com
      - key: DATABASE_PROVIDER
        value: mongo
      - key: MONGODB_DB_NAME
        value: dangro
      # Media is served from THIS origin out of MongoDB GridFS. Nothing is
      # hosted on a separate machine, so no image load ever leaves the site,
      # nothing is exposed to the LAN, and there is no 302 to a raw IP address.
      # Atlas M0's free tier covers this; see MEDIA.md.
      - key: MEDIA_PROVIDER
        value: gridfs
      # Set these in the Render Dashboard (Environment tab), never in the repo:
      #   MONGODB_URI  the mongodb+srv:// string from Atlas
      - key: MONGODB_URI
        sync: false
      # Cloudinary stores and delivers images. All three are required before
      # any image upload succeeds; without them the upload returns 503 with an
      # explicit message rather than silently writing to the local disk.
      # Render -> Environment. Never give any of these a VITE_ prefix: that
      # would inline the secret into the browser bundle.
      #
      # The service pings Cloudinary on every boot and logs the result, so a
      # wrong value shows up in the deploy log rather than on the first upload:
      #   [startup] Image uploads: Cloudinary OK (cloud "..."), folder "..."
      # GET /api/health reports the same as "imageStorage".
      # (CLOUDINARY_URL="cloudinary://KEY:SECRET@CLOUD" is accepted instead,
      # but not alongside these.)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Email — signup verification, password reset and address-change
      # confirmations. Until these are set the service boots and every other
      # feature works, but signup / resend / forgot-password return 503 with an
      # explicit message and NO account is created, so nobody is stranded by a
      # missing variable. The boot log says so, and GET /api/health reports
      # "emailDelivery": "unconfigured".
      #
      # APP_BASE_URL must be this service's public origin: it is what every
      # emailed link is built from, and a localhost link works for one person.
      # Values go in Render -> Environment, never in this file.
      #
      # Full setup, provider comparison and troubleshooting: EMAIL.md
      - key: APP_BASE_URL
        sync: false
      # Resend: SMTP_HOST=smtp.resend.com, SMTP_PORT=465, SMTP_USER=resend
      # Brevo:  SMTP_HOST=smtp-relay.brevo.com, SMTP_PORT=587
      # Gmail:  SMTP_HOST=smtp.gmail.com, SMTP_PORT=587 + an App Password
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Must be on a domain verified with your provider, or nothing is sent.
      - key: EMAIL_FROM
        sync: false